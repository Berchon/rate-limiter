name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Check mocks are up to date
        run: |
          make mocks
          git diff --exit-code internal/business/usecase/mock

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with race detector and coverage gate
        run: make test-unit

      - name: Publish unit coverage summary
        if: always()
        run: |
          if [ ! -f coverage-unit.out ]; then
            echo "Unit coverage report not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total="$(go tool cover -func=coverage-unit.out | awk '/^total:/ {print $3}')"
          {
            echo "### Unit Test Coverage: ${total:-0%}"
            echo ""
            echo "| Target | Statements | Coverage |"
            echo "| :--- | :--- | ---: |"
            go tool cover -func=coverage-unit.out | awk '
              /^total:/ { next }
              NF >= 3 {
                printf "| `%s` | `%s` | **%s** |\n", $1, $2, $3
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests with race detector and coverage gate
        run: make test-integration

      - name: Publish integration coverage summary
        if: always()
        run: |
          if [ ! -f coverage-integration.out ]; then
            echo "Integration coverage report not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total="$(go tool cover -func=coverage-integration.out | awk '/^total:/ {print $3}')"
          {
            echo "### Integration Test Coverage: ${total:-0%}"
            echo ""
            echo "| Target | Statements | Coverage |"
            echo "| :--- | :--- | ---: |"
            go tool cover -func=coverage-integration.out | awk '
              /^total:/ { next }
              NF >= 3 {
                printf "| `%s` | `%s` | **%s** |\n", $1, $2, $3
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rate-limiter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
